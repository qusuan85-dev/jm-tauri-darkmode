<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f5" />
    <!--
      Resolve the theme before the first paint so a dark-mode cold start never
      flashes the light window background. Keep in sync with src/settings/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("jm_theme_mode");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored !== "light" && prefersDark);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          root.style.backgroundColor = dark ? "#09090b" : "#f4f4f5";
          var accent = localStorage.getItem("jm_accent");
          if (accent) root.dataset.accent = accent;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#09090b" : "#f4f4f5");
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <title>JM</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
